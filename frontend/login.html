<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · Client Memory Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --border: #e6e3dd;
    --text: #1c1b19; --text-muted: #75716a; --accent: #b5651d; --bad: #c0392b;
    --shadow-md: 0 4px 10px rgba(28,27,25,0.06), 0 2px 4px rgba(28,27,25,0.05);
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text); font-family: var(--sans);
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 380px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 36px 32px;
    text-align: center;
    box-shadow: var(--shadow-md);
  }
  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
    color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px;
  }
  h1 { font-size: 19px; margin: 0 0 8px; font-weight: 600; }
  p.sub { color: var(--text-muted); font-size: 13.5px; margin: 0 0 28px; line-height: 1.5; }
  .google-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; background: #fff; color: #1f1f1f;
    border: 1px solid var(--border); border-radius: 8px; padding: 11px 0;
    font-family: var(--sans); font-size: 14px; font-weight: 500;
    cursor: pointer; text-decoration: none;
  }
  .google-btn:hover { background: #f7f7f5; }
  .error {
    margin-top: 18px; font-size: 12.5px; color: var(--bad);
    font-family: var(--mono);
  }
  .footnote { margin-top: 22px; font-size: 11.5px; color: var(--text-muted); line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow"><span id="brandName">Client Memory Console</span></div>
    <h1>Sign in to continue</h1>
    <p class="sub">Your account keeps its own Anthropic API key, kept encrypted and private to you.</p>
    <a class="google-btn" href="/auth/google/login">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.92a8.78 8.78 0 002.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.98v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 013.68 9c0-.6.1-1.18.29-1.72V4.95H.98A9 9 0 000 9c0 1.45.35 2.83.98 4.05l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 00.98 4.95l2.99 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Sign in with Google
    </a>
    <div id="errorMsg" class="error" style="display:none;"></div>
    <div class="footnote">Restricted to approved accounts. Contact your admin if you don't have access.</div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === 'domain_not_allowed') {
      const el = document.getElementById('errorMsg');
      el.style.display = 'block';
      el.textContent = 'That Google account isn\'t on the approved list for this console.';
    }

    // No session yet on this page, so this can't reuse apiFetch (which
    // redirects to /login on 401 - the exact page already showing).
    // Any failure is swallowed - branding is cosmetic.
    async function applyBranding() {
      try {
        const res = await fetch('/api/branding');
        if (!res.ok) return;
        const b = await res.json();
        document.documentElement.style.setProperty('--accent', b.accent_color);
        const nameEl = document.getElementById('brandName');
        if (nameEl) nameEl.textContent = b.name;
        if (b.name) document.title = document.title.replace('Client Memory Console', b.name);
      } catch (e) {
        // swallowed - see the comment above this function
      }
    }
    applyBranding();
  </script>
</body>
</html>
