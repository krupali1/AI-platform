<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projects · Client Memory Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --panel-raised: #fbfaf8; --border: #e6e3dd;
    --text: #1c1b19; --text-muted: #75716a; --accent: #b5651d; --accent-bg: #f6ece2;
    --good: #1a8a5f;
    --shadow-sm: 0 1px 2px rgba(28,27,25,0.05), 0 1px 3px rgba(28,27,25,0.06);
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .title { font-family: var(--mono); letter-spacing: 0.04em; font-size: 14px; color: var(--text); font-weight: 600; }
  .title strong { color: var(--text); }
  a.back {
    font-family: var(--mono); font-size: 11.5px; color: var(--text-muted);
    text-decoration: none; border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px;
  }
  a.back:hover { color: var(--text); border-color: var(--accent); }

  main { max-width: 860px; margin: 0 auto; padding: 28px; }
  .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .col-label {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    color: var(--text-muted); text-transform: uppercase;
  }
  .new-btn {
    font-family: var(--mono); font-size: 11px; color: var(--text-muted);
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; cursor: pointer;
  }
  .new-btn:hover { color: var(--text); border-color: var(--accent); }

  .new-form {
    display: none; gap: 8px; flex-wrap: wrap; margin-bottom: 18px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
    box-shadow: var(--shadow-sm);
  }
  .new-form.open { display: flex; }
  .new-form input {
    background: var(--panel-raised); border: 1px solid var(--border); color: var(--text);
    font-family: var(--mono); font-size: 12.5px; padding: 8px 10px; border-radius: 6px;
    flex: 1; min-width: 200px;
  }
  .new-form button {
    font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--accent);
    color: #fff; background: var(--accent); border-radius: 6px; padding: 8px 14px; cursor: pointer;
  }
  .new-form button:hover { opacity: 0.88; }

  table {
    width: 100%; border-collapse: collapse; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-sm);
  }
  th {
    text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-muted); font-weight: 500;
    padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--panel-raised);
  }
  td { padding: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .proj-name { font-weight: 600; }
  .proj-domain {
    color: var(--text-muted); font-family: var(--mono); font-size: 11px;
    max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .counts { font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); }
  .counts strong { color: var(--text); }
  .open-btn {
    font-family: var(--mono); font-size: 11px; color: var(--accent);
    background: var(--panel); border: 1px solid var(--accent); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; text-decoration: none;
  }
  .open-btn:hover { background: var(--accent-bg); }
  .empty-note { color: var(--text-muted); font-size: 13px; padding: 30px 0; text-align: center; }

  .app-shell { display: flex; min-height: calc(100vh - 57px); }
  .sidebar {
    width: 220px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border); padding: 18px 0;
  }
  .sidebar-nav { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; }
  .sidebar-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted); padding: 6px 12px; margin-top: 14px;
  }
  .sidebar-label:first-child { margin-top: 0; }
  .sidebar-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 6px;
    color: var(--text); text-decoration: none; font-size: 13px; cursor: pointer;
    background: transparent; border: none; width: 100%; text-align: left; font-family: var(--sans);
  }
  .sidebar-item:hover { background: var(--accent-bg); }
  .sidebar-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .content-area { flex: 1; min-width: 0; }
  @media (max-width: 720px) { .sidebar { display: none; } }
</style>
</head>
<body>

<header>
  <div class="title">CLIENT MEMORY CONSOLE <span style="color:var(--text-muted)">·</span> <strong>ALL PROJECTS</strong></div>
  <a class="back" href="/">← Current project</a>
</header>

<div class="app-shell">
  <aside class="sidebar">
    <nav class="sidebar-nav">
      <div class="sidebar-label">Workspace</div>
      <a class="sidebar-item" href="/">Dashboard</a>
      <a class="sidebar-item active" href="/projects">All Projects</a>
      <a class="sidebar-item" href="/repository">Repository</a>
      <a class="sidebar-item" id="sidebarAdminLink" href="/admin" style="display:none;">Admin</a>
      <div class="sidebar-label">Account</div>
      <a class="sidebar-item" href="/auth/logout">Sign out</a>
    </nav>
  </aside>

  <div class="content-area">
    <main>
  <div class="top-row">
    <div class="col-label">Projects</div>
    <button class="new-btn" onclick="toggleForm()">+ New project</button>
  </div>

  <div class="new-form" id="newForm">
    <input id="name" type="text" placeholder="Project name" />
    <input id="domain" type="text" placeholder="Client email domain, optional" />
    <button onclick="createProject()">Create</button>
  </div>

  <table id="table" style="display:none;">
    <thead>
      <tr><th>Project</th><th>Domain</th><th>Stored</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty-note" id="emptyNote" style="display:none;">No projects yet - create one above.</div>
</main>
  </div>
</div>

<script>
async function apiFetch(url, opts) {
  const res = await fetch(url, opts);
  if (res.status === 401) { window.location.href = '/login'; throw new Error('unauthenticated'); }
  return res;
}

function toggleForm() {
  document.getElementById('newForm').classList.toggle('open');
}

async function createProject() {
  const name = document.getElementById('name').value.trim();
  const domain = document.getElementById('domain').value.trim();
  if (!name) return;
  const res = await apiFetch('/api/projects', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, domain }),
  });
  if (!res.ok) {
    const body = await res.json();
    alert(body.detail || 'Could not create project');
    return;
  }
  window.location.href = '/';
}

async function openProject(id) {
  await apiFetch(`/api/projects/${id}/select`, { method: 'POST' });
  window.location.href = '/';
}

async function loadProjects() {
  const res = await apiFetch('/api/projects');
  const projects = await res.json();
  if (!projects.length) {
    document.getElementById('emptyNote').style.display = 'block';
    return;
  }
  document.getElementById('table').style.display = 'table';
  document.getElementById('rows').innerHTML = projects.map(p => `
    <tr>
      <td><div class="proj-name">${p.name}</div></td>
      <td><div class="proj-domain" title="${p.domain || ''}">${p.domain || '—'}</div></td>
      <td>
        <div class="counts">
          <strong>${p.meetings_count}</strong> meetings ·
          <strong>${p.documents_count}</strong> docs ·
          <strong>${p.decisions_count}</strong> decisions ·
          <strong>${p.action_items_count}</strong> actions
        </div>
      </td>
      <td><button class="open-btn" onclick="openProject(${p.id})">Open →</button></td>
    </tr>
  `).join('');
}

async function loadRole() {
  const res = await apiFetch('/api/me');
  const me = await res.json();
  if (me.role === 'admin') {
    document.getElementById('sidebarAdminLink').style.display = 'block';
  }
}

loadProjects();
loadRole();
</script>
</body>
</html>
