<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Online Sales Accountant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-sunken:#FAF3EB; --surface-warm:#FDEEE3;
    --ink:#241B14; --ink-muted:#6B5D51; --ink-faint:#9C8C7E;
    --line:#EDE0D1; --line-soft:#F4EBDF;
    --accent:#0E7C5A; --accent-hover:#0B6A4C; --accent-ink:#FFFFFF; --accent-soft:#E7F5EE; --accent-soft-line:#BFE3D2;
    --warm:#D9622A; --warm-soft:#FDEEE3;
    --ok:#2E7D46; --ok-soft:#E5F3E8;
    --warn:#AD7A0B; --warn-soft:#FBF1D9;
    --crit:#B23A2E; --crit-soft:#FAE7E4;
    --shadow:0 1px 2px rgba(36,27,20,0.06), 0 8px 24px rgba(36,27,20,0.06);
    color-scheme:light;
  }
  /* color-scheme above stops the browser giving unstyled buttons/selects/
     inputs their native dark-mode text color (white) when the OS is in
     dark mode, which renders invisible on our light backgrounds. */
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif; font-size:14.5px; line-height:1.55; -webkit-font-smoothing:antialiased;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums;}
  h1,h2,h3,h4{font-weight:600; letter-spacing:-0.01em; text-wrap:balance; margin:0;}
  button{font-family:inherit; font-size:inherit; cursor:pointer; color:inherit;}
  textarea,input,select{font-family:inherit; color:inherit;}
  a{color:inherit;}
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .shell{display:grid; grid-template-columns:258px 1fr; min-height:100vh;}
  @media (max-width:900px){ .shell{grid-template-columns:1fr;} .sidebar{display:none;} }

  .sidebar{background:var(--surface-sunken); border-right:1px solid var(--line); display:flex; flex-direction:column; height:100vh; position:sticky; top:0;}
  .sb-top{padding:16px 14px 10px;}
  .brand{display:flex; align-items:center; gap:9px; padding:4px 6px 14px; border:none; background:none; color:inherit; text-align:left; width:100%;}
  .brand-mark{width:28px; height:28px; border-radius:8px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
  .brand-text{font-weight:600; font-size:14.5px; line-height:1.2;}
  .brand-text small{display:block; font-weight:400; font-size:10.5px; color:var(--ink-faint);}
  .newchat{display:flex; align-items:center; gap:9px; width:100%; padding:10px 13px; border-radius:9px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:13.5px;}
  .newchat:hover{border-color:var(--accent-soft-line); background:var(--accent-soft); color:var(--accent-hover);}

  .sb-nav{padding:10px 14px 4px; display:flex; flex-direction:column; gap:1px;}
  .sb-nav-item{position:relative; display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; border:none; background:none; color:var(--ink-muted); font-size:13.5px; font-weight:500; text-align:left; width:100%;}
  .sb-nav-item:hover{background:var(--surface);}
  .sb-nav-item.active{background:var(--accent-soft); color:var(--accent-hover); font-weight:600;}
  .sb-icon{width:17px; text-align:center; flex-shrink:0; font-size:14.5px;}
  .badge-dot{position:absolute; right:10px; top:8px; min-width:16px; height:16px; padding:0 4px; border-radius:99px; background:var(--warm); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; font-family:"IBM Plex Mono",monospace;}

  .sb-hist{flex:1; overflow-y:auto; padding:14px 14px 10px;}
  .sb-hist-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); font-weight:600; padding:8px 10px 6px;}
  .chat-row{position:relative;}
  .chat-item{display:block; width:100%; text-align:left; padding:8px 28px 8px 10px; border-radius:8px; border:none; background:none; color:var(--ink-muted); font-size:13px; margin-bottom:1px;}
  .chat-item:hover{background:var(--surface);}
  .chat-item.active{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:inset 2px 0 0 var(--accent);}
  .chat-item .t{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;}
  .chat-item .m{font-size:11px; color:var(--ink-faint); margin-top:1px;}
  .chat-del{position:absolute; right:5px; top:50%; transform:translateY(-50%); width:22px; height:22px; border:none; background:none; color:var(--ink-faint); border-radius:6px; font-size:12.5px; line-height:1; opacity:0; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .chat-row:hover .chat-del{opacity:1;}
  .chat-del:hover{background:var(--surface); color:#C0392B;}

  .sb-bottom{border-top:1px solid var(--line); padding:12px 14px; position:relative;}
  .user-pill{display:flex; align-items:center; gap:9px; width:100%; padding:8px 9px; border-radius:9px; border:none; background:none; text-align:left;}
  .user-pill:hover{background:var(--surface);}
  .avatar{width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; color:#fff;}
  .user-meta{flex:1; min-width:0;}
  .user-name{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .user-role{font-size:11px; color:var(--ink-faint);}
  .user-pop{position:absolute; bottom:60px; left:14px; right:14px; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:6px; z-index:20;}
  .user-pop button{display:flex; align-items:center; gap:9px; width:100%; padding:8px 9px; border-radius:8px; border:none; background:none; text-align:left; font-size:13px;}
  .user-pop button:hover{background:var(--surface-sunken);}

  .main{min-width:0; display:flex; flex-direction:column; height:100vh;}
  .topbar{display:flex; align-items:center; gap:12px; padding:13px 22px; border-bottom:1px solid var(--line-soft); flex-shrink:0;}
  .topbar h2{font-size:15px;}
  .topbar .sub{font-size:12px; color:var(--ink-faint);}
  .spacer{flex:1;}
  .icon-btn{width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--ink-muted); position:relative;}
  .icon-btn:hover{background:var(--surface-sunken);}

  .thread{flex:1; overflow-y:auto; padding:26px 0 10px;}
  .thread-inner{max-width:780px; margin:0 auto; padding:0 24px; display:flex; flex-direction:column; gap:20px;}
  .empty-hero{min-height:52vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px;}
  .empty-hero .mark{width:44px; height:44px; border-radius:14px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:19px; margin-bottom:8px;}
  .empty-hero h1{font-size:22px;}
  .empty-hero p{max-width:440px; color:var(--ink-muted); font-size:13.5px; margin:4px 0 0;}
  .start-form{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:22px; align-items:flex-end;}
  .start-field label{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; margin-bottom:5px; text-align:left;}
  .start-field select, .start-field input{padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--surface); font:inherit; font-size:13px; min-width:150px;}

  .msg{display:flex; gap:12px;}
  .msg-avatar{width:28px; height:28px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; margin-top:2px; background:var(--accent); color:#fff;}
  .msg.user{flex-direction:row-reverse;}
  .msg-body{max-width:82%;}
  .msg.bot .msg-body{max-width:100%; flex:1;}
  .msg-text{font-size:14.5px; line-height:1.6;}
  .msg.user .msg-text{background:var(--accent); color:#fff; border-radius:14px; border-bottom-right-radius:4px; padding:11px 15px;}
  .file-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:7px; justify-content:flex-end;}
  .file-chip{display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font-size:12px; color:var(--ink-muted);}
  .file-chip button{background:none; border:none; color:var(--ink-faint); padding:0 2px; font-size:13px;}
  .quick-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .quick-btn{display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:99px; border:1px solid var(--accent); color:var(--accent-hover); font-size:12.5px; font-weight:600; background:var(--surface);}
  .quick-btn:hover{background:var(--accent-soft);}
  .quick-btn[disabled]{opacity:.45; cursor:not-allowed;}

  .steps{display:flex; flex-direction:column; gap:8px;}
  .steps .si{display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--ink-muted);}
  .steps .si .tick{width:16px; height:16px; border-radius:50%; background:var(--ok-soft); color:var(--ok); display:flex; align-items:center; justify-content:center; font-size:10px; flex-shrink:0;}
  .steps .si .spin{width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent); flex-shrink:0; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow);}
  .card-head{display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:12px 15px; border-bottom:1px solid var(--line-soft);}
  .card-icon{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;}
  .card-icon.green{background:var(--accent-soft); color:var(--accent-hover);}
  .card-icon.amber{background:var(--warn-soft); color:var(--warn);}
  .card-icon.crit{background:var(--crit-soft); color:var(--crit);}
  .card-title{font-weight:600; font-size:13.5px;}
  .card-sub{font-size:12px; color:var(--ink-faint); margin-top:1px;}

  .chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600; line-height:1.6; white-space:nowrap;}
  .chip-ok{background:var(--ok-soft); color:var(--ok);}
  .chip-warn{background:var(--warn-soft); color:var(--warn);}
  .chip-crit{background:var(--crit-soft); color:var(--crit);}
  .chip-neutral{background:var(--surface-sunken); color:var(--ink-muted);}

  .issue{border-bottom:1px solid var(--line-soft);}
  .issue:last-child{border-bottom:none;}
  .issue-head{display:flex; align-items:center; gap:11px; padding:13px 15px; width:100%; text-align:left; border:none; background:none;}
  .issue-head:hover{background:var(--surface-sunken);}
  .issue-icon{width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:12px; font-weight:700;}
  .issue-icon.error{background:var(--crit-soft); color:var(--crit);}
  .issue-icon.warning{background:var(--warn-soft); color:var(--warn);}
  .issue-title{font-weight:600; font-size:13.5px;}
  .issue-loc{font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .issue-chev{color:var(--ink-faint); font-size:12px; transition:transform .15s; flex-shrink:0;}
  .issue-chev.open{transform:rotate(180deg);}
  .issue-resolved{display:flex; align-items:center; gap:10px; padding:13px 15px;}
  .issue-resolved .ok-dot{width:16px;height:16px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;}
  .issue-resolved .t{flex:1; color:var(--ink-faint); text-decoration:line-through; font-size:13px;}

  .issue-panel{padding:0 15px 16px;}
  .issue-body{font-size:13.5px; color:var(--ink-muted); line-height:1.6; margin:0 0 10px;}
  .facts{background:var(--surface-sunken); border-radius:9px; padding:2px 12px; margin-bottom:12px;}
  .fact{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:12.5px;}
  .fact:last-child{border-bottom:none;}
  .fact .k{color:var(--ink-faint);}
  .fact .v{font-weight:600; text-align:right;}

  .mode-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .mode-btn{display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:8px; border:1px solid var(--line); font-size:12.5px; font-weight:600; color:var(--ink-muted); background:var(--surface);}
  .mode-btn.on{border-color:var(--accent); background:var(--accent); color:#fff;}
  .mode-panel{border:1px solid var(--line); border-radius:10px; padding:14px;}

  .sugg-line{font-size:13.5px; color:var(--ink); margin:0 0 10px;}
  .sugg-changes{display:flex; flex-direction:column; gap:6px; margin-bottom:12px;}
  .sugg-change{display:flex; flex-wrap:wrap; align-items:center; gap:8px; background:var(--surface-sunken); border-radius:8px; padding:8px 11px; font-size:12.5px;}
  .sugg-change .from{color:var(--ink-faint); text-decoration:line-through;}
  .sugg-change .to{font-weight:600; color:var(--accent-hover);}

  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .field.full{grid-column:1/-1;}
  .field label{display:block; font-size:11.5px; font-weight:600; color:var(--ink-muted); margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--paper); font:inherit; color:inherit; font-size:13px;}

  .btn{display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:600; font-size:13px; white-space:nowrap;}
  .btn:hover{border-color:var(--ink-faint);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-hover); border-color:var(--accent-hover);}
  .btn-outline{border-color:var(--accent); color:var(--accent-hover); background:var(--surface);}
  .btn-outline:hover{background:var(--accent-soft);}
  .btn-danger{color:var(--crit);}
  .btn-sm{padding:6px 11px; font-size:12px;}
  .btn[disabled]{opacity:.4; cursor:not-allowed;}
  .actions-end{display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap;}

  .reupload-drop{border:2px dashed var(--line); border-radius:10px; padding:20px; text-align:center; cursor:pointer; font-size:12.5px; color:var(--ink-muted);}
  .reupload-drop:hover{border-color:var(--accent); background:var(--accent-soft);}

  .final-card .fchead{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line-soft); background:linear-gradient(135deg,var(--surface-warm),var(--surface));}
  .final-table-wrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; padding:9px 11px; background:var(--accent); color:#fff; font-weight:600; white-space:nowrap; font-size:11px;}
  td{padding:9px 11px; border-top:1px solid var(--line-soft); white-space:nowrap; color:var(--ink-muted);}
  tr.row-flagged td, tr.row-escalated td{background:var(--warn-soft);}
  tr.row-resolved td{background:var(--accent-soft);}
  .final-actions{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:13px 15px; border-top:1px solid var(--line-soft); background:var(--surface-sunken);}

  .chat-col{position:relative; display:flex; flex-direction:column; flex:1; min-width:0;}
  .drop-overlay{position:absolute; inset:8px; background:var(--accent-soft); border:2px dashed var(--accent); border-radius:14px; display:none; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--accent-hover); pointer-events:none; z-index:5;}
  .composer-wrap{padding:14px 24px 20px; border-top:1px solid var(--line-soft);}
  .attach-list{max-width:780px; margin:0 auto 8px; display:flex; flex-wrap:wrap; gap:6px;}
  .attach-pill{display:flex; align-items:center; gap:7px; padding:6px 11px; border-radius:8px; background:var(--surface-sunken); font-size:12px;}
  .composer{max-width:780px; margin:0 auto; border:1.5px solid var(--line); border-radius:16px; background:var(--surface); padding:10px 10px 10px 14px; display:flex; align-items:center; gap:8px; box-shadow:var(--shadow); position:relative;}
  .composer .placeholder-text{flex:1; color:var(--ink-faint); font-size:14px;}
  .attach-btn{width:34px; height:34px; border-radius:9px; border:none; background:var(--surface-sunken); display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--ink-muted); flex-shrink:0;}
  .attach-btn:hover{background:var(--accent-soft); color:var(--accent-hover);}
  .attach-btn[disabled]{opacity:.4; cursor:not-allowed;}
  .send-btn{width:34px; height:34px; border-radius:9px; border:none; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
  .send-btn:hover{background:var(--accent-hover);}
  .send-btn[disabled]{background:var(--line); cursor:not-allowed;}
  .attach-menu{position:absolute; bottom:52px; left:10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:6px; width:280px; max-height:360px; overflow-y:auto;}
  .attach-menu .lbl{padding:6px 10px 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600;}
  .attach-menu button.item{display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:8px; border:none; background:none; text-align:left; font-size:12.5px;}
  .attach-menu button.item:hover{background:var(--surface-sunken);}
  .attach-menu button.item span.nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .attach-menu button.item span.tag{flex-shrink:0; font-size:9.5px; color:var(--ink-faint); text-transform:uppercase;}
  .composer-hint{max-width:780px; margin:8px auto 0; font-size:11.5px; color:var(--ink-faint); text-align:center;}

  .page{padding:28px 32px 60px; max-width:1080px; margin:0 auto; overflow-y:auto; flex:1;}
  .page-head{margin-bottom:22px;}
  .page-head h1{font-size:21px;}
  .page-head p{margin:6px 0 0; color:var(--ink-muted); font-size:13.5px; max-width:64ch;}
  .tabs{display:flex; gap:6px; margin-bottom:22px; flex-wrap:wrap;}
  .tabbtn{display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:9px; border:1px solid var(--line); background:var(--surface); font-size:13px; font-weight:600; color:var(--ink-muted);}
  .tabbtn.on{border-color:var(--accent); background:var(--accent); color:#fff;}

  .role-card-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px;}
  @media (max-width:760px){.role-card-grid{grid-template-columns:1fr;}}
  .role-card{border:1px solid var(--line); border-radius:12px; padding:16px; background:var(--surface);}
  .role-card .h{display:flex; align-items:center; gap:9px; margin-bottom:7px; font-weight:600; font-size:14px;}
  .role-card p{font-size:12.5px; color:var(--ink-muted); margin:0;}
  .role-card .where{margin-top:10px; font-size:12px; font-weight:600; color:var(--accent-hover);}

  .person-row{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line-soft); flex-wrap:wrap;}
  .person-row:last-child{border-bottom:none;}
  .person-meta{flex:1; min-width:120px;}
  .person-name{font-size:13.5px; font-weight:600;}
  .person-email{font-size:12px; color:var(--ink-faint);}
  .invite-row{display:flex; gap:8px; padding:12px 16px; background:var(--surface-sunken); flex-wrap:wrap;}
  .invite-row input{flex:1; min-width:140px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font:inherit;}
  .invite-row select{padding:9px 11px; border:1px solid var(--line); border-radius:8px; font:inherit;}

  .platform-list{display:flex; flex-direction:column; gap:2px;}
  .platform-list button{width:100%; text-align:left; padding:9px 12px; border-radius:8px; border:none; background:none; font-size:13px; color:var(--ink-muted);}
  .platform-list button.on{background:var(--accent-soft); color:var(--accent-hover); font-weight:600;}
  .platform-list button:hover{background:var(--surface-sunken);}

  .skill-lib-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; display:flex; gap:14px; margin-bottom:12px; box-shadow:var(--shadow); flex-wrap:wrap;}
  .skill-lib-icon{width:42px; height:42px; border-radius:10px; background:var(--accent-soft); color:var(--accent-hover); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
  .skill-lib-body{flex:1; min-width:200px;}
  .skill-lib-body .name{font-weight:600; font-size:14.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .skill-lib-body .desc{font-size:13px; color:var(--ink-muted); margin-top:3px;}
  .skill-lib-meta{font-size:11.5px; color:var(--ink-faint); margin-top:8px; display:flex; gap:14px; flex-wrap:wrap;}

  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 20px; border-radius:99px; font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,0.25); z-index:100; display:flex; align-items:center; gap:9px; max-width:460px; font-weight:500;}
  .toast .x{background:var(--crit-soft); color:var(--crit); width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; font-weight:700;}

  .notif-pop{position:absolute; top:44px; right:0; width:340px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); z-index:30; overflow:hidden;}
  .notif-head{padding:12px 15px; border-bottom:1px solid var(--line-soft); font-weight:600; font-size:13.5px; display:flex; justify-content:space-between; align-items:center;}
  .notif-head button{background:none;border:none;color:var(--accent-hover);font-size:11.5px;font-weight:600;}
  .notif-item{padding:12px 15px; border-bottom:1px solid var(--line-soft); font-size:13px; cursor:pointer;}
  .notif-item:hover{background:var(--surface-sunken);}
  .notif-item:last-child{border-bottom:none;}
  .notif-item.unread{background:var(--accent-soft);}
  .notif-item .t{font-weight:600; margin-bottom:2px;}
  .notif-item .m{color:var(--ink-muted); font-size:12.5px;}
  .notif-empty{padding:30px 15px; text-align:center; color:var(--ink-faint); font-size:13px;}

  .table-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);}

  /* approver / review grid */
  .grid-view{display:flex; flex-direction:column; height:100%; flex:1; min-width:0;}
  .grid-topbar{display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line-soft);}
  .grid-body{flex:1; display:flex; min-height:0;}
  .grid-table-wrap{flex:1; overflow:auto;}
  .comment-rail{width:300px; flex-shrink:0; border-left:1px solid var(--line); overflow-y:auto; padding:16px;}
  td.cellable{cursor:pointer;}
  td.cellable:hover{background:var(--accent-soft) !important;}
  td.flag-error{background:var(--crit-soft); color:var(--crit); font-weight:600;}
  td.flag-query{background:var(--warn-soft); color:var(--warn); font-weight:600;}
  .sev-row{display:flex; gap:6px; margin-bottom:10px;}
  .sev-btn{flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); font-size:12.5px; font-weight:600; background:var(--surface);}
  .sev-btn.on{border-color:var(--accent); background:var(--accent); color:#fff;}
  .comment-card{border:1px solid var(--line); border-radius:9px; padding:10px 11px; margin-bottom:8px;}
  .comment-card .h{display:flex; align-items:center; gap:7px; margin-bottom:5px;}
  .comment-card .sevdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .comment-card .loc{font-size:12px; font-weight:600;}
  .comment-card .txt{font-size:12.5px; color:var(--ink-muted);}

  .modal-backdrop{position:fixed; inset:0; background:rgba(36,27,20,0.45); display:flex; align-items:center; justify-content:center; z-index:60; padding:20px;}
  .modal{background:var(--surface); border-radius:14px; max-width:560px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.3); max-height:88vh; overflow-y:auto;}
  .modal-head{padding:18px 20px 4px; display:flex; justify-content:space-between; align-items:flex-start;}
  .modal-head h3{font-size:15.5px;}
  .modal-close{background:none; border:none; color:var(--ink-faint); font-size:18px; padding:2px 6px;}
  .modal-body{padding:14px 20px 20px;}
  .vhist-row{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line-soft); font-size:13px;}
  .vhist-row:last-child{border-bottom:none;}
  .vhist-badge{font-family:"IBM Plex Mono",monospace; font-size:11px; background:var(--surface-sunken); color:var(--ink-muted); padding:2px 7px; border-radius:6px; flex-shrink:0;}
</style>
</head>
<body>

<div class="shell">
  <div class="sidebar">
    <div class="sb-top">
      <button class="brand" onclick="go('chat', null)"><span class="brand-mark">O</span><span class="brand-text">Online Sales Accountant<small>Online sales &rarr; Tally register</small></span></button>
      <button class="newchat" onclick="newChat()"><span>&#43;</span> New chat</button>
    </div>
    <div class="sb-nav">
      <button class="sb-nav-item" data-page="approvals" id="navApprovals" style="display:none;" onclick="go('approvals')"><span class="sb-icon">&#9989;</span> Approvals</button>
      <button class="sb-nav-item" data-page="repository" onclick="go('repository')"><span class="sb-icon">&#128193;</span> Data Repository</button>
      <button class="sb-nav-item" data-page="skills" onclick="go('skills','library')"><span class="sb-icon">&#127919;</span> Agent Management</button>
    </div>
    <div class="sb-hist">
      <div class="sb-hist-label">Recent chats</div>
      <div id="chatList"></div>
    </div>
    <div class="sb-bottom">
      <div id="userPop"></div>
      <button class="user-pill" onclick="toggleUserPop()">
        <div class="avatar" id="curAvatar"></div>
        <div class="user-meta"><div class="user-name" id="curName"></div><div class="user-role" id="curRole"></div></div>
        <span style="color:var(--ink-faint);font-size:12px;">&#9662;</span>
      </button>
    </div>
  </div>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div id="mainBody" style="flex:1; display:flex; min-height:0;"></div>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ================= API layer ================= */
async function apiFetch(url, opts){
  opts = opts || {};
  const res = await fetch(url, opts);
  if(res.status === 401){ window.location.href = '/login'; throw new Error('unauthenticated'); }
  return res;
}
async function apiJson(url, opts){
  const res = await apiFetch(url, opts);
  const body = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(body.detail || 'Request failed');
  return body;
}
function toast(msg, isError){
  const root = document.getElementById('toastRoot');
  root.innerHTML = `<div class="toast">${isError?'<span class="x">&times;</span>':'<span style="color:#8FE0B8;">&#10003;</span>'}<span>${escapeHtml(msg)}</span></div>`;
  clearTimeout(window.__toastT); window.__toastT = setTimeout(()=>root.innerHTML='', 4200);
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSize(n){ if(n>1024*1024) return (n/1024/1024).toFixed(1)+' MB'; if(n>1024) return (n/1024).toFixed(0)+' KB'; return (n||0)+' B'; }
function fmtWhen(iso){ if(!iso) return ''; const d = new Date(iso); const now = new Date(); const sameDay = d.toDateString()===now.toDateString(); return sameDay ? d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : d.toLocaleDateString([], {day:'numeric', month:'short'}); }

const ROLE_COLOR = { creator:'#0E7C5A', approver:'#3B5B8C', admin:'#D9622A' };
const ROLE_LABEL = { creator:'Creator', approver:'Approver', admin:'Admin' };
function initialsOf(name){ return (name||'?').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase(); }

/* ================= App state ================= */
const STATE = {
  me: null, platforms: [], runs: [], activeRunId: null, run: null, files: [],
  inputIssues: [], generations: [], generation: null, finalIssues: [], reviewIssues: [],
  slices: { order_types: [], locations: [] }, notifications: [],
  activePage: 'chat', skillsTab: 'library', skillsPlatform: null,
  eventPollTimer: null, statusPollTimer: null, notifPollTimer: null,
  approverPending: [], approverActive: null, approverRows: [], gridSel: null, gridComments: [],
  rules: [], mappings: [], users: [], pendingNew: false,
};

/* ================= Boot ================= */
async function boot(){
  STATE.me = await apiJson('/api/me');
  await loadPlatforms();
  await loadRuns();
  await loadNotifications();
  await loadSampleFormat();
  renderAll();
  clearInterval(window.__notifInterval);
  window.__notifInterval = setInterval(loadNotificationsQuiet, 20000);
}
boot();

async function loadSampleFormat(){
  try{ STATE.sampleFormat = await apiJson('/api/tally-sample-format'); }catch(e){ STATE.sampleFormat = {columns:[]}; }
}
function hasSampleFormatSkill(){ return (STATE.sampleFormat && STATE.sampleFormat.columns && STATE.sampleFormat.columns.length > 0); }
async function loadPlatforms(){ STATE.platforms = await apiJson('/api/tally-platforms'); }
async function loadRuns(){
  STATE.runs = await apiJson('/api/tally-runs');
  STATE.runs.sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
}
async function loadNotifications(){
  try{ STATE.notifications = await apiJson('/api/notifications'); }catch(e){ STATE.notifications = []; }
}
async function loadNotificationsQuiet(){
  await loadNotifications();
  renderSidebar(); renderTopbar();
}

function platformName(slug){ const p = STATE.platforms.find(p=>p.slug===slug); return p ? p.display_name : slug; }
function me(){ return STATE.me || {username:'', display_name:'', role:'creator'}; }
function isAdmin(){ return me().role === 'admin'; }
function isApprover(){ return me().role === 'approver'; }

/* ================= Navigation ================= */
function go(page, sub){
  STATE.activePage = page;
  if(page==='chat' && sub!==undefined) STATE.activeRunId = sub;
  if(page==='skills') STATE.skillsTab = sub || STATE.skillsTab;
  STATE.gridSel = null;
  renderAll();
  if(page==='chat' && STATE.activeRunId) selectRun(STATE.activeRunId);
}
async function newChat(){
  STATE.pendingNew = true;
  STATE.activeRunId = null; STATE.run = null; STATE.files = []; STATE.inputIssues = [];
  STATE.generations = []; STATE.generation = null; STATE.finalIssues = []; STATE.reviewIssues = [];
  STATE.activePage = 'chat';
  renderAll();
}
async function deleteRun(id){
  const run = STATE.runs.find(r=>r.id===id);
  const label = run ? `${platformName(run.platform_slug)}${run.period_label ? ' · '+run.period_label : ''}` : 'this chat';
  if(!confirm(`Delete "${label}"? This removes all its files and any Tally sheets built from it. This can't be undone.`)) return;
  try{
    await apiFetch(`/api/tally-runs/${id}`, {method:'DELETE'});
    await loadRuns();
    if(STATE.activeRunId === id){
      STATE.activeRunId = null; STATE.run = null; STATE.files = []; STATE.inputIssues = [];
      STATE.generations = []; STATE.generation = null; STATE.finalIssues = []; STATE.reviewIssues = [];
      STATE.pendingNew = false;
    }
    renderAll();
    toast('Chat deleted', false);
  }catch(e){ toast(e.message || 'Delete failed', true); }
}
async function selectRun(runId){
  clearTimeout(STATE.statusPollTimer); clearTimeout(STATE.eventPollTimer);
  STATE.pendingNew = false;
  STATE.activeRunId = runId;
  STATE.run = await apiJson(`/api/tally-runs/${runId}`);
  STATE.files = await apiJson(`/api/tally-runs/${runId}/files`);
  STATE.inputIssues = (STATE.run.status==='needs_review' || STATE.run.status==='ready')
    ? await apiJson(`/api/tally-runs/${runId}/review-items`) : [];
  STATE.generations = await apiJson(`/api/tally-runs/${runId}/generations`);
  const latest = STATE.generations[0] || null;
  if(latest) await loadGeneration(latest.id); else STATE.generation = null;
  renderAll();
}
async function loadGeneration(id){
  STATE.generation = await apiJson(`/api/tally-generations/${id}`);
  STATE.qaReportFor = null;    // this generation's data may have just changed - force a fresh QA re-check
  if(STATE.generation.status === 'processing'){
    STATE.finalIssues = []; STATE.reviewIssues = [];
  } else {
    STATE.finalIssues = await apiJson(`/api/tally-generations/${id}/review-items?stage=final`);
    STATE.reviewIssues = STATE.generation.review_status === 'returned'
      ? await apiJson(`/api/tally-generations/${id}/review-items?stage=review`) : [];
  }
}

/* ================= Sidebar ================= */
function renderSidebar(){
  document.querySelectorAll('.sb-nav-item').forEach(el=>el.classList.toggle('active', el.dataset.page===STATE.activePage));
  const navApprovals = document.getElementById('navApprovals');
  if(navApprovals) navApprovals.style.display = (isApprover() || isAdmin()) ? '' : 'none';
  const list = document.getElementById('chatList');
  list.innerHTML = STATE.runs.map(r=>{
    const active = STATE.activePage==='chat' && r.id===STATE.activeRunId;
    const title = `${platformName(r.platform_slug)}${r.period_label ? ' · '+r.period_label : ''}`;
    return `<div class="chat-row">
      <button class="chat-item ${active?'active':''}" onclick="go('chat',${r.id})">
        <span class="t">${escapeHtml(title)}</span><span class="m">${fmtWhen(r.created_at)} &middot; ${statusLabel(r.status)}</span>
      </button>
      <button class="chat-del" title="Delete this chat" onclick="event.stopPropagation(); deleteRun(${r.id})">&#128465;&#65039;</button>
    </div>`;
  }).join('') || '<div style="padding:10px;font-size:12px;color:var(--ink-faint);">No chats yet.</div>';
  const p = me();
  document.getElementById('curAvatar').style.background = ROLE_COLOR[p.role] || '#888';
  document.getElementById('curAvatar').textContent = initialsOf(p.display_name);
  document.getElementById('curName').textContent = p.display_name || p.username;
  document.getElementById('curRole').textContent = ROLE_LABEL[p.role] || p.role;
}
function statusLabel(s){
  return {draft:'Draft', needs_review:'Needs review', ready:'Ready', processing:'Processing', failed:'Failed'}[s] || s;
}
function toggleUserPop(){
  const el = document.getElementById('userPop');
  if(el.innerHTML){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="user-pop">
    <button onclick="toggleUserPop(); go('skills','roles');">&#128100; My role &amp; people</button>
    <button onclick="doLogout()">&#8620; Sign out</button>
  </div>`;
}
async function doLogout(){
  await apiFetch('/api/logout', { method:'POST' });
  window.location.href = '/login';
}

/* ================= Topbar ================= */
function renderTopbar(){
  const top = document.getElementById('topbar');
  const unread = STATE.notifications.filter(n=>!n.is_read).length;
  const bell = `<div style="position:relative;"><button class="icon-btn" onclick="toggleNotifPop()">&#128276;${unread?`<span class="badge-dot">${unread}</span>`:''}</button><div id="notifPop"></div></div>`;
  if(STATE.activePage==='chat'){
    const r = STATE.run;
    const title = r ? `${platformName(r.platform_slug)}${r.period_label ? ' · '+r.period_label : ''}` : 'New chat';
    top.innerHTML = `<div><h2>${escapeHtml(title)}</h2><div class="sub">as ${escapeHtml(me().display_name)} &middot; ${ROLE_LABEL[me().role]}</div></div><div class="spacer"></div>${bell}`;
  } else if(STATE.activePage==='approvals'){
    top.innerHTML = `<div><h2>Approvals</h2><div class="sub">Sheets other people have sent for your review</div></div><div class="spacer"></div>${bell}`;
  } else if(STATE.activePage==='skills'){
    top.innerHTML = `<div><h2>Agent Management</h2><div class="sub">What the agent reads before checking any file</div></div><div class="spacer"></div>${bell}`;
  } else {
    top.innerHTML = `<div><h2>Data Repository</h2><div class="sub">Every month's final Tally sheet, by platform</div></div><div class="spacer"></div>${bell}`;
  }
}
function toggleNotifPop(){
  const el = document.getElementById('notifPop'); if(!el) return;
  if(el.innerHTML){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="notif-pop"><div class="notif-head"><span>Notifications</span>${STATE.notifications.some(n=>!n.is_read)?'<button onclick="markAllNotifsRead()">Mark all read</button>':''}</div>
    ${STATE.notifications.length ? STATE.notifications.map(n=>`
      <div class="notif-item ${n.is_read?'':'unread'}" onclick="openNotification(${n.id}, ${n.generation_id})">
        <div class="t">${escapeHtml(n.title)}</div><div class="m">${escapeHtml(n.message||'')}</div><div class="m" style="margin-top:4px;color:var(--ink-faint);">${fmtWhen(n.created_at)}</div>
      </div>`).join('') : `<div class="notif-empty">Nothing yet.</div>`}
  </div>`;
}
async function markAllNotifsRead(){
  await apiFetch('/api/notifications/read-all', {method:'POST'});
  await loadNotifications(); toggleNotifPop(); toggleNotifPop(); renderTopbar();
}
async function openNotification(id, generationId){
  await apiFetch(`/api/notifications/${id}/read`, {method:'POST'});
  await loadNotifications();
  toggleNotifPop();
  if(generationId){
    try{
      const gen = await apiJson(`/api/tally-generations/${generationId}`);
      const run = STATE.runs.find(r=>r.id===gen.run_id) || await apiJson(`/api/tally-runs/${gen.run_id}`);
      if((isApprover()||isAdmin()) && gen.review_status==='submitted'){ go('approvals'); openApproverGeneration(generationId); return; }
      go('chat', run.id);
    }catch(e){ renderAll(); }
  } else renderTopbar();
}

/* ================= Main body dispatch ================= */
function renderAll(){ renderSidebar(); renderTopbar(); renderMainBody(); }
function renderMainBody(){
  const root = document.getElementById('mainBody');
  if(STATE.activePage==='approvals'){ renderApproverView(root); return; }
  if(STATE.activePage==='skills'){ root.innerHTML = `<div class="page">${pageSkills()}</div>`; wireSkillsPage(); return; }
  if(STATE.activePage==='repository'){ root.innerHTML = `<div class="page">${pageRepository()}</div>`; loadRepository(); return; }
  root.innerHTML = renderChatColumn();
  const t = document.getElementById('thread'); if(t) t.scrollTop = t.scrollHeight;
}

/* ================= Chat column (every role can build a sheet) ================= */
function renderChatColumn(){
  return `<div class="chat-col" id="chatCol" ondragover="onChatDragOver(event)" ondragleave="onChatDragLeave(event)" ondrop="onChatDrop(event)">
    <div class="thread" id="thread"><div class="thread-inner" id="threadInner">${renderThreadContent()}</div></div>
    ${renderComposer()}
    <div class="drop-overlay" id="dropOverlay">&#128193; Drop files to attach</div>
  </div>`;
}
function onChatDragOver(e){
  e.preventDefault();
  if(!STATE.run) return;
  e.dataTransfer.dropEffect = 'copy';
  const el = document.getElementById('dropOverlay');
  if(el) el.style.display = 'flex';
}
function onChatDragLeave(e){
  if(e.currentTarget.contains(e.relatedTarget)) return;
  const el = document.getElementById('dropOverlay');
  if(el) el.style.display = 'none';
}
async function onChatDrop(e){
  e.preventDefault();
  const el = document.getElementById('dropOverlay');
  if(el) el.style.display = 'none';
  if(!STATE.run){ toast('Start a chat before attaching files.', true); return; }
  const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
  if(!files.length) return;
  const detectedList = [], otherList = [];
  for(const f of files){
    const tag = resolveFileTag(f, 'other', {label: f.name});
    if(tag.detected) detectedList.push(`${f.name} (${tag.detected.label})`); else otherList.push(f.name);
    await uploadFile(f, tag.role, tag.extra);
  }
  summarizeAutoTags(detectedList, otherList);
}
function renderComposer(){
  const disabled = !STATE.run;
  const hint = !STATE.run ? 'Start a new chat to attach files.' : 'Attach the month\'s files (or drag and drop, even several at once), then check the sheets.';
  return `<div class="composer-wrap">
      <div class="attach-list" id="attachList">${renderAttachList()}</div>
      <div class="composer">
        <div style="position:relative;"><button class="attach-btn" onclick="toggleAttachMenu()" ${disabled?'disabled':''}>&#43;</button><div id="attachMenu"></div></div>
        <span class="placeholder-text">${escapeHtml(hint)}</span>
      </div>
      <div class="composer-hint">Nothing posts to Tally on its own — an Approver signs off, then it's downloaded or emailed.</div>
    </div>`;
}
function renderAttachList(){
  if(!STATE.files.length) return '';
  return STATE.files.map(f=>`<span class="attach-pill">&#128196; ${escapeHtml(f.original_filename)}</span>`).join('');
}
const UPLOAD_MENU = [
  {role:'sales', orderType:'B2B', label:'B2B MTR Sales', tag:'sales'},
  {role:'sales', orderType:'B2C', label:'B2C MTR Sales', tag:'sales'},
  {role:'batch_summary', label:'Batch wise Summary', tag:''},
  {role:'master', label:'Master File', tag:'optional'},
  {role:'sample_tally', label:'Sample Tally Sheet', tag:'sample'},
  {role:'sales', orderType:'', label:'Other sales report…', tag:'prompt-order-type'},
  {role:'rules_sheet', label:'Rules & Exceptions sheet', tag:'optional'},
  {role:'column_mapping', label:'Column Mapping sheet', tag:'optional'},
  {role:'other', label:'Additional file…', tag:'prompt-label'},
];
function toggleAttachMenu(){
  const el = document.getElementById('attachMenu');
  if(el.innerHTML){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="attach-menu">
    <div class="lbl">Upload for this run</div>
    ${UPLOAD_MENU.map((u,i)=>{
      const tag = u.tag==='sample' ? (hasSampleFormatSkill()?'optional — Skill set':'required') : u.tag==='required' ? 'required' : (u.tag==='sales'||u.tag.startsWith('prompt')) ? '' : u.tag;
      return `<button class="item" onclick="onAttachPick(${i})"><span class="nm">&#128196; ${escapeHtml(u.label)}</span><span class="tag">${tag}</span></button>`;
    }).join('')}
    <div class="lbl">Or</div>
    <button class="item" onclick="pickFolder()">&#128193; Upload a whole folder</button>
  </div>`;
}
function onAttachPick(i){
  toggleAttachMenu();
  const u = UPLOAD_MENU[i];
  if(u.tag==='prompt-order-type'){
    const ot = prompt('What is this report type? (e.g. MFN)'); if(!ot) return;
    pickAndUpload(u.role, {order_type: ot});
  } else if(u.tag==='prompt-label'){
    const label = prompt('Label this file (e.g. HSN code list)') || '';
    pickAndUpload(u.role, {label});
  } else {
    pickAndUpload(u.role, u.orderType!==undefined ? {order_type: u.orderType} : {});
  }
}
// Which role a file actually gets is decided by its filename, not by
// which + menu button was clicked - a human picking the wrong button
// (e.g. tagging a file named "...B2C..." as B2B) is exactly the
// failure mode this exists to prevent. The clicked button (or 'other'
// for drag-and-drop/folder upload) is only a fallback for filenames
// with no clear signal in them.
function detectFileRole(filename){
  const name = (filename||'').toLowerCase();
  if(name.includes('b2b')) return {role:'sales', order_type:'B2B', label:'a B2B Sales Report'};
  if(name.includes('b2c')) return {role:'sales', order_type:'B2C', label:'a B2C Sales Report'};
  if(/batch.*summary|stock.*summary/.test(name)) return {role:'batch_summary', label:'the Batch wise Summary'};
  if(name.includes('sku') && name.includes('list') || name.includes('master')) return {role:'master', label:'the Master File'};
  if(/sample.*tally|tally.*format/.test(name)) return {role:'sample_tally', label:'the Sample Tally Sheet'};
  return null;
}
function resolveFileTag(file, fallbackRole, fallbackExtra){
  fallbackExtra = fallbackExtra || {};
  const detected = detectFileRole(file.name);
  if(!detected) return {role: fallbackRole, extra: fallbackExtra, detected: null};
  const extra = Object.assign({}, fallbackExtra);
  if(detected.order_type !== undefined) extra.order_type = detected.order_type;
  const overridden = detected.role !== fallbackRole || (detected.order_type||'') !== (fallbackExtra.order_type||'');
  return {role: detected.role, extra, detected: overridden ? detected : null};
}
function summarizeAutoTags(detectedList, otherList){
  const parts = [];
  if(detectedList.length) parts.push(`Tagged by filename: ${detectedList.join(', ')}`);
  if(otherList.length) parts.push(`Added as Additional files (re-tag from the + menu if needed): ${otherList.join(', ')}`);
  if(parts.length) toast(parts.join(' — '), false);
}
function pickAndUpload(role, extra){
  const input = document.createElement('input');
  input.type = 'file'; input.multiple = true; input.style.display = 'none';
  input.addEventListener('change', async ()=>{
    const files = Array.from(input.files);
    const retagged = [];
    for(const f of files){
      const tag = resolveFileTag(f, role, extra||{});
      if(tag.detected) retagged.push(`${f.name} → ${tag.detected.label}`);
      await uploadFile(f, tag.role, tag.extra);
    }
    if(retagged.length) toast(`Tagged by filename instead of the button clicked: ${retagged.join(', ')}`, false);
    input.remove();
  });
  document.body.appendChild(input); input.click();
}
function pickFolder(){
  toggleAttachMenu();
  const input = document.createElement('input');
  input.type = 'file'; input.webkitdirectory = true; input.multiple = true; input.style.display = 'none';
  input.addEventListener('change', async ()=>{
    const files = Array.from(input.files);
    if(!files.length){ input.remove(); return; }
    const detectedList = [], otherList = [];
    for(const f of files){
      const tag = resolveFileTag(f, 'other', {label: f.webkitRelativePath || f.name});
      if(tag.detected) detectedList.push(`${f.name} (${tag.detected.label})`); else otherList.push(f.name);
      await uploadFile(f, tag.role, tag.extra);
    }
    summarizeAutoTags(detectedList, otherList);
    input.remove();
  });
  document.body.appendChild(input); input.click();
}
async function ensureRun(){
  if(STATE.run) return STATE.run.id;
  const run = await apiJson('/api/tally-runs', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({platform_slug: STATE.startPlatform || (STATE.platforms[0]||{}).slug, period_label: STATE.startPeriod || ''})});
  await loadRuns();
  STATE.pendingNew = false;
  STATE.activeRunId = run.id;
  STATE.run = await apiJson(`/api/tally-runs/${run.id}`);
  STATE.files = [];
  return run.id;
}
async function uploadFile(fileObj, role, extra){
  extra = extra || {};
  try{
    await ensureRun();
    const wasPastDraft = STATE.run.status !== 'draft';
    const fd = new FormData();
    fd.append('file', fileObj); fd.append('file_role', role);
    fd.append('label', extra.label || ''); fd.append('order_type', extra.order_type || '');
    const res = await apiFetch(`/api/tally-runs/${STATE.run.id}/files`, {method:'POST', body: fd});
    const body = await res.json().catch(()=>({}));
    if(!res.ok){ toast(body.detail || 'Upload failed', true); return; }
    await selectRun(STATE.run.id);
    if(body.import_summary) await rerunAfterRuleChange();
    else if(wasPastDraft) await recheckAfterUpload();
  }catch(e){ toast(e.message, true); }
}
// Files can be added at any stage - not just while the run is still
// "draft". Once the sheets have already been checked once, a new
// upload (e.g. a Master file added to resolve a missing-SKU error)
// needs to trigger a fresh check on its own rather than sitting
// unused until someone happens to notice and re-check manually.
async function recheckAfterUpload(){
  toast('Files changed — rechecking all the files…', false);
  await checkSheets();
  if(STATE.inputIssues.filter(i=>i.status==='pending').length===0) await rerunAfterRuleChange();
}
async function rerunAfterRuleChange(){
  if(!STATE.generation) return;
  const wasLocked = ['submitted','approved','returned'].includes(STATE.generation.review_status);
  try{
    await apiFetch(`/api/tally-generations/${STATE.generation.id}/regenerate`, {method:'POST'});
    await loadGeneration(STATE.generation.id);
    if(wasLocked && STATE.generation.review_status==='draft'){
      toast('This sheet was already reviewed — it was reset to draft since the input files changed, and will need approval again.', false);
    }
    renderThread();
  }catch(e){}
}
async function removeFile(fileId){
  const wasPastDraft = STATE.run.status !== 'draft';
  await apiFetch(`/api/tally-runs/${STATE.run.id}/files/${fileId}`, {method:'DELETE'});

}

/* ---- exceptions card (real TallyReviewItem.detail shape) ---- */
const ISSUE_GROUP_RENDER_CAP = 200;
function exceptionsCard(scope, list, open, heading){
  if(!list.length) return '';
  // Grouped by exact title - the same "no Batch Summary data for X at
  // Y" (or "no matching rule") message repeats verbatim for every row
  // hitting that same root cause, so at real-data scale (hundreds of
  // rows) a flat list is unreadable and un-scrollable. Sorted
  // biggest-group-first so the root cause most worth fixing sits at
  // the top, not buried under one-off rows.
  const groups = {}; const order = [];
  list.forEach(item=>{
    const key = item.title;
    if(!groups[key]){ groups[key] = {title:key, severity:item.severity, source_label:item.source_label, items:[]}; order.push(key); }
    groups[key].items.push(item);
  });
  const groupList = order.map(k=>groups[k]).sort((a,b)=>b.items.length-a.items.length);
  STATE.issueGroups = STATE.issueGroups || {};
  STATE.issueGroups[scope] = groupList;
  return `<div class="card">
    <div class="card-head"><div class="card-icon ${open?'amber':'green'}">${open?'&#9888;':'&#10003;'}</div>
      <div style="flex:1;"><div class="card-title">${heading}</div><div class="card-sub">${open?`${open} open — settle each one below`:'All settled'}</div></div>
      <span class="chip ${open?'chip-warn':'chip-ok'}">${list.length-open}/${list.length}</span></div>
    ${groupList.map((g,gi)=>renderIssueGroup(scope, gi, g)).join('')}
  </div>`;
}
function renderIssueGroup(scope, gi, group){
  if(group.items.length === 1) return renderIssue(scope, group.items[0]);
  const resolvedCount = group.items.filter(i=>i.status!=='pending').length;
  const allResolved = resolvedCount === group.items.length;
  const sev = group.severity === 'error' ? 'error' : 'warning';
  const groupId = `group-${scope}-${gi}`;
  return `<div class="issue" id="issuewrap-${groupId}">
    <button class="issue-head" onclick="toggleIssueGroup('${scope}',${gi})">
      <div class="issue-icon ${sev}" style="${allResolved?'background:var(--ok-soft);color:var(--ok);':''}">${allResolved?'&#10003;':(sev==='error'?'!':'&middot;')}</div>
      <div style="flex:1;"><div class="issue-title">${escapeHtml(group.title)}</div><div class="issue-loc">${escapeHtml(group.source_label||'')} &middot; ${group.items.length} row(s) affected</div></div>
      <span class="chip ${allResolved?'chip-ok':'chip-warn'}">${resolvedCount}/${group.items.length}</span>
      <span class="issue-chev" id="chev-${groupId}">&#9662;</span>
    </button>
    <div class="issue-panel" id="open-${groupId}" style="display:none;padding:0;"></div>
  </div>`;
}
function toggleIssueGroup(scope, gi){
  const groupId = `group-${scope}-${gi}`;
  const panel = document.getElementById(`open-${groupId}`);
  const chev = document.getElementById(`chev-${groupId}`);
  if(!panel) return;
  const show = panel.style.display === 'none';
  panel.style.display = show ? 'block' : 'none';
  if(chev) chev.classList.toggle('open', show);
  if(show && !panel.dataset.rendered){
    const group = (STATE.issueGroups[scope] || [])[gi];
    const shown = group.items.slice(0, ISSUE_GROUP_RENDER_CAP);
    panel.innerHTML = shown.map(iss=>renderIssue(scope, iss)).join('')
      + (group.items.length > ISSUE_GROUP_RENDER_CAP ? `<div style="padding:11px 15px;font-size:12px;color:var(--ink-faint);">${group.items.length - ISSUE_GROUP_RENDER_CAP} more row(s) with this same exception, not shown here. Resolving the root cause (a rule, mapping, or missing batch data) clears all of them at once.</div>` : '');
    panel.dataset.rendered = '1';
  }
}
function findIssueList(scope){ return scope==='input' ? STATE.inputIssues : scope==='final' ? STATE.finalIssues : STATE.reviewIssues; }
function findIssue(scope, id){ return findIssueList(scope).find(i=>i.id===id); }

function renderIssue(scope, iss){
  const resolved = iss.status !== 'pending';
  if(resolved){
    const label = iss.resolution_mode==='reupload' ? 'Sheet re-uploaded' : iss.resolution_mode==='suggest' ? 'Suggestion approved' : iss.resolution_mode==='deferred' ? 'Left for later' : 'Fixed';
    return `<div class="issue" id="issuewrap-${scope}-${iss.id}"><div class="issue-resolved"><span class="ok-dot">&#10003;</span><span class="t">${escapeHtml(iss.title)}</span><span class="chip chip-ok">${label}</span></div></div>`;

const MODE_LABELS = { suggest:'&#10024; Take the suggestion', fix:'&#9998; Fix here', reupload:'&#11015; Re-upload sheet' };

function pickReupload(scope, id){
  const input = document.createElement('input');
  input.type='file'; input.accept='.xlsx,.csv'; input.style.display='none';
  input.addEventListener('change', async ()=>{
    if(input.files[0]) await resolveIssueUpload(scope, id, input.files[0]);
    input.remove();
  });
  document.body.appendChild(input); input.click();
}
async function resolveIssue(scope, id, action, body){
  try{
    await apiJson(`/api/tally-review-items/${id}/${action}`, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {method:'POST'});
    toast(action==='defer' ? 'Left for later.' : 'Resolved.');
    await refreshAfterIssueChange(scope);
  }catch(e){ toast(e.message, true); }
}
async function resolveIssueUpload(scope, id, file){
  try{
    const fd = new FormData(); fd.append('file', file);
    const res = await apiFetch(`/api/tally-review-items/${id}/reupload`, {method:'POST', body: fd});
    if(!res.ok){ const b = await res.json().catch(()=>({})); throw new Error(b.detail || 'Upload failed'); }
    toast('Sheet replaced — re-checked automatically.');
    await refreshAfterIssueChange(scope);
  }catch(e){ toast(e.message, true); }
}
async function refreshAfterIssueChange(scope){
  if(scope==='input'){
    STATE.run = await apiJson(`/api/tally-runs/${STATE.run.id}`);
    STATE.inputIssues = await apiJson(`/api/tally-runs/${STATE.run.id}/review-items`);
    await loadRuns();
  } else if(STATE.generation){
    await loadGeneration(STATE.generation.id);
    STATE.generations = await apiJson(`/api/tally-runs/${STATE.run.id}/generations`);
  }
  renderThread(); renderSidebar();
}
async function resolveReviewComments(){
  try{
    await apiJson(`/api/tally-generations/${STATE.generation.id}/resolve-review`, {method:'POST'});
    toast('Cleared for download and email.');
    await loadGeneration(STATE.generation.id);

const QA_ROW_RENDER_CAP = 50;
function qaReportCard(){
  const report = STATE.qaReport;
  loadQaReportOnce();
  if(!report){
    return `<div class="card" style="padding:14px 16px;"><div class="steps"><div class="si"><span class="spin"></span>Running quality checks…</div></div></div>`;
  }
  const headChip = report.status==='fail' ? {c:'chip-crit', t:'Issues found'} : report.status==='warn' ? {c:'chip-warn', t:'Review suggested'} : {c:'chip-ok', t:'All clear'};
  const headIcon = report.status==='fail' ? 'crit' : report.status==='warn' ? 'amber' : 'green';
  return `<div class="card">
    <div class="card-head"><div class="card-icon ${headIcon}">${report.status==='pass'?'&#10003;':'&#9888;'}</div>

    ${report.checks.map((c,ci)=>renderQaCheck(c,ci)).join('')}
  </div>`;
}
function renderQaCheck(c, ci){
  const chip = c.status==='fail' ? 'chip-crit' : c.status==='warn' ? 'chip-warn' : 'chip-ok';
  const label = c.status==='fail' ? 'Fail' : c.status==='warn' ? 'Warn' : 'Pass';
  const hasRows = (c.affected_row_ids||[]).length > 0;
  const openId = `qacheck-${ci}`;
  if(!hasRows){
    return `<div style="display:flex;align-items:flex-start;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line-soft);">
      <span class="chip ${chip}" style="flex-shrink:0;">${label}</span>
      <div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:600;">${escapeHtml(c.label)}</div><div style="font-size:12.5px;color:var(--ink-muted);margin-top:2px;">${escapeHtml(c.detail)}</div></div>
    </div>`;
  }
  return `<div class="issue" id="issuewrap-qa-${ci}">
    <button class="issue-head" onclick="toggleQaCheck(${ci})">
      <span class="chip ${chip}" style="flex-shrink:0;">${label}</span>
      <div style="flex:1;min-width:0;padding-left:1px;"><div style="font-size:13px;font-weight:600;">${escapeHtml(c.label)}</div><div style="font-size:12.5px;color:var(--ink-muted);margin-top:2px;">${escapeHtml(c.detail)}</div></div>
      <span class="issue-chev" id="chev-${openId}">&#9662;</span>
    </button>
    <div class="issue-panel" id="${openId}" style="display:none;padding:0;"></div>
  </div>`;
}
async function toggleQaCheck(ci){
  const panel = document.getElementById(`qacheck-${ci}`);
  const chev = document.getElementById(`chev-qacheck-${ci}`);
  if(!panel) return;
  const show = panel.style.display === 'none';
  panel.style.display = show ? 'block' : 'none';
  if(chev) chev.classList.toggle('open', show);
  if(show && !panel.dataset.rendered){
    panel.innerHTML = `<div style="padding:14px 15px;color:var(--ink-faint);font-size:12.5px;">Loading affected rows…</div>`;
    await ensureQaRowLookup();
    const c = STATE.qaReport.checks[ci];
    const ids = c.affected_row_ids.slice(0, QA_ROW_RENDER_CAP);
    panel.innerHTML = ids.map(id=>renderQaRow(ci, c, id)).join('')
      + (c.affected_row_ids.length > QA_ROW_RENDER_CAP ? `<div style="padding:10px 15px;font-size:12px;color:var(--ink-faint);">${c.affected_row_ids.length - QA_ROW_RENDER_CAP} more row(s) not shown.</div>` : '');
    panel.dataset.rendered = '1';
  }
}
async function ensureQaRowLookup(){
  if(STATE.qaRowLookupFor === STATE.generation.id) return;
  const data = await apiJson(`/api/tally-generations/${STATE.generation.id}/output-rows?page_size=20000`);

}
function renderQaRow(ci, c, rowId){

      <div style="flex:1;min-width:0;font-size:12.5px;">${summary}</div>

function qaToggleFix(ci, rowId){

  </div>

async function qaSaveFix(ci, rowId){

}
function toggleTeachBulk(){
  const el = document.getElementById('teachBulk');
  if(!el) return;
  if(el.innerHTML){ el.innerHTML=''; return; }
  el.innerHTML = `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft);">
    <p style="font-size:12px;color:var(--ink-faint);margin-bottom:8px;">Paste a whole SOP, policy note, or list of exceptions — the agent pulls out every rule it can find, for you to review one by one before anything is saved.</p>
    <textarea id="teachBulkInput" rows="7" placeholder="Paste text here…" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:13px;resize:vertical;"></textarea>
    <div class="actions-end" style="margin-top:8px;"><button class="btn btn-sm btn-primary" onclick="proposeRulesBulk()">&#10024; Extract rules</button></div>
    <div id="teachBulkResult"></div>
  </div>`;
}
async function proposeRulesBulk(){
  const text = document.getElementById('teachBulkInput').value.trim(); if(!text) return;
  const result = document.getElementById('teachBulkResult');
  result.innerHTML = `<p style="font-size:12.5px;color:var(--ink-faint);margin-top:10px;">Reading the document…</p>`;
  try{
    const suggestions = await apiJson('/api/tally-rules/suggest-from-text', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text})});
    window.__proposedRulesBulk = suggestions;
    if(!suggestions.length){ result.innerHTML = `<p style="font-size:13px;color:var(--ink-faint);margin-top:10px;">No rules found in that text.</p>`; return; }
    result.innerHTML = `<div style="margin-top:12px;display:flex;flex-direction:column;gap:10px;">${suggestions.map((s,i)=>renderBulkRuleSuggestion(s,i)).join('')}</div>`;
  }catch(e){ result.innerHTML = `<p style="color:var(--crit);font-size:13px;margin-top:10px;">${escapeHtml(e.message)}</p>`; }
}
function renderBulkRuleSuggestion(s, i){
  const hasWarnings = (s.warnings||[]).length > 0;
  return `<div class="mode-panel" id="bulkrule-${i}">
    ${s.demo?'<div class="chip chip-warn" style="margin-bottom:8px;">Demo suggestion — no AI key configured</div>':'<div class="chip chip-neutral" style="margin-bottom:8px;">AI-generated — verify before applying</div>'}
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-hover);font-weight:600;">${escapeHtml(s.rule_group)}</div>
    <p style="font-size:13.5px;margin:6px 0 0;">${escapeHtml(s.description||'')}</p>
    <p style="font-size:12px;color:var(--ink-faint);margin-top:8px;">IF ${escapeHtml(s.condition_field)} ${escapeHtml(s.condition_operator)} ${escapeHtml(s.condition_value||'')} THEN ${escapeHtml(s.action_type)} ${escapeHtml(s.action_field||'')} ${escapeHtml(s.action_value||'')}</p>
    ${hasWarnings ? `<div class="facts" style="margin-top:10px;border:1px solid var(--crit);"><div class="fact" style="display:block;padding:8px 0;"><span class="k" style="color:var(--crit);font-weight:600;">This suggestion looks wrong:</span></div>${s.warnings.map(w=>`<div class="fact"><span class="v" style="color:var(--crit);text-align:left;">${escapeHtml(w)}</span></div>`).join('')}</div>` : ''}
    <div class="actions-end" style="margin-top:12px;"><button class="btn btn-sm" onclick="document.getElementById('bulkrule-${i}').remove()">Discard</button><button class="btn btn-sm btn-primary" ${hasWarnings?'disabled title="Fix the issues above before this can be saved"':''} onclick="applyBulkRule(${i})">&#10003; Add to the Skill</button></div>
  </div>`;
}
async function applyBulkRule(i){
  const s = (window.__proposedRulesBulk||[])[i]; if(!s) return;
  try{
    await apiJson('/api/tally-rules', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
      rule_group: s.rule_group, order_index: s.order_index||0, condition_field: s.condition_field,
      condition_operator: s.condition_operator, condition_value: s.condition_value||'', action_type: s.action_type,
      action_field: s.action_field||'', action_value: s.action_value||'', is_active: true, description: s.description||'',
    })});
    toast('Rule added.');
    const el = document.getElementById(`bulkrule-${i}`); if(el) el.remove();
    await loadRulesAndMappings();
  }catch(e){ toast(e.message, true); }
}
async function proposeRule(){
  const text = document.getElementById('teachInput').value.trim(); if(!text) return;
  const result = document.getElementById('teachResult');
  result.innerHTML = `<p style="font-size:12.5px;color:var(--ink-faint);margin-top:10px;">Thinking…</p>`;
  try{
    const s = await apiJson('/api/tally-rules/suggest', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({context: text})});
    window.__proposedRule = s;
    const hasWarnings = (s.warnings||[]).length > 0;
    result.innerHTML = `<div class="mode-panel" style="margin-top:12px;">
      ${s.demo?'<div class="chip chip-warn" style="margin-bottom:8px;">Demo suggestion — no AI key configured</div>':'<div class="chip chip-neutral" style="margin-bottom:8px;">AI-generated — verify before applying</div>'}
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-hover);font-weight:600;">New rule &middot; ${escapeHtml(s.rule_group)}</div>
      <p style="font-size:13.5px;margin:6px 0 0;">${escapeHtml(s.description||'')}</p>
      <p style="font-size:12px;color:var(--ink-faint);margin-top:8px;">IF ${escapeHtml(s.condition_field)} ${escapeHtml(s.condition_operator)} ${escapeHtml(s.condition_value||'')} THEN ${escapeHtml(s.action_type)} ${escapeHtml(s.action_field||'')} ${escapeHtml(s.action_value||'')}</p>
      ${hasWarnings ? `<div class="facts" style="margin-top:10px;border:1px solid var(--crit);"><div class="fact" style="display:block;padding:8px 0;"><span class="k" style="color:var(--crit);font-weight:600;">This suggestion looks wrong:</span></div>${s.warnings.map(w=>`<div class="fact"><span class="v" style="color:var(--crit);text-align:left;">${escapeHtml(w)}</span></div>`).join('')}</div>` : ''}
      <div class="actions-end" style="margin-top:12px;"><button class="btn btn-sm" onclick="document.getElementById('teachResult').innerHTML=''">Discard</button><button class="btn btn-sm btn-primary" ${hasWarnings?'disabled title="Fix the issues above before this can be saved"':''} onclick="applyProposedRule()">&#10003; Add to the Skill</button></div>
    </div>`;
  }catch(e){ result.innerHTML = `<p style="color:var(--crit);font-size:13px;margin-top:10px;">${escapeHtml(e.message)}</p>`; }
}
async function applyProposedRule(){
  const s = window.__proposedRule; if(!s) return;
  try{
    await apiJson('/api/tally-rules', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
      rule_group: s.rule_group, order_index: s.order_index||0, condition_field: s.condition_field,
      condition_operator: s.condition_operator, condition_value: s.condition_value||'', action_type: s.action_type,
      action_field: s.action_field||'', action_value: s.action_value||'', is_active: true, description: s.description||'',
    })});
    toast('Rule added.');
    document.getElementById('teachInput').value = '';
    await loadRulesAndMappings();
    document.getElementById('skillsTabBody').innerHTML = skillsRules();
  }catch(e){ toast(e.message, true); }
}

async function saveRuleForm(ruleId){
  const payload = {
    rule_group: document.getElementById('rf-group').value, order_index: parseInt(document.getElementById('rf-order').value)||0,
    condition_field: document.getElementById('rf-cf').value, condition_operator: document.getElementById('rf-op').value,

    action_field: document.getElementById('rf-af').value, action_value: document.getElementById('rf-av').value,
    is_active: true, description: document.getElementById('rf-desc').value,
  };
  try{
    if(ruleId) await apiJson(`/api/tally-rules/${ruleId}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
    else await apiJson('/api/tally-rules', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
    closeModal(); toast('Rule saved.');
    await loadRulesAndMappings(); document.getElementById('skillsTabBody').innerHTML = skillsRules();
  }catch(e){ toast(e.message, true); }
}

    closeModal(); toast('Rule deleted.');
    await loadRulesAndMappings(); document.getElementById('skillsTabBody').innerHTML = skillsRules();
  }catch(e){ toast(e.message, true); }
}

async function showRuleVersions(){

async function restoreRuleVersion(versionId){

    await apiJson(`/api/tally-rules/versions/${versionId}/restore`, {method:'POST'});

async function loadUsers(){
  if(!isAdmin()){ STATE.users = []; return; }
  try{ STATE.users = await apiJson('/api/users'); }catch(e){ STATE.users = []; }
}
function skillsRoles(){
  const cards = [
    {r:'Creator', d:'Runs the agent — uploads the month\'s reports, settles exceptions in chat and builds the Tally sheet.', where:'Chat workspace'},
    {r:'Approver', d:'Reviews the finished sheet in a grid, flags cells and comments. Sends it back, or approves it.', where:'Review grid'},
    {r:'Admin', d:'Owns the Skills — SKU mapping, sample format, rules. Nobody else can change them.', where:'Skills'},
  ];
  return `<div class="role-card-grid">${cards.map(c=>`<div class="role-card"><div class="h">&#128100; ${c.r}</div><p>${c.d}</p><div class="where">${c.where}</div></div>`).join('')}</div>
    <div class="card"><div class="card-head"><div style="flex:1;"><div class="card-title">People</div><div class="card-sub">${isAdmin() ? `${STATE.users.length} people in this workspace` : 'You are signed in as ' + escapeHtml(me().display_name)}</div></div>${!isAdmin()?'<span class="chip chip-warn">&#128274; Admin only</span>':''}</div>
      ${isAdmin() ? STATE.users.map(u=>`<div class="person-row"><div class="avatar" style="background:${ROLE_COLOR[u.role]||'#888'};">${initialsOf(u.display_name)}</div>
        <div class="person-meta"><div class="person-name">${escapeHtml(u.display_name)}${!u.is_active?' <span style="color:var(--warn);font-weight:400;font-size:11.5px;">inactive</span>':''}</div><div class="person-email">${escapeHtml(u.email||u.username)}</div></div>
        <select onchange="changeUserRole(${u.id}, this.value)" style="padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;">
          ${['creator','approver','admin'].map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${ROLE_LABEL[r]}</option>`).join('')}</select>
        ${u.is_active ? `<button class="btn btn-sm" onclick="deactivateUser(${u.id})" style="color:var(--crit);">&#128465;</button>` : ''}
      </div>`).join('') : ''}
      ${isAdmin()?`<div class="invite-row"><input id="inviteUsername" placeholder="username"><input id="inviteName" placeholder="Display name"><input id="invitePassword" type="password" placeholder="Temporary password"><select id="inviteRole">${['creator','approver','admin'].map(r=>`<option value="${r}">${ROLE_LABEL[r]}</option>`).join('')}</select><button class="btn btn-primary btn-sm" onclick="inviteUser()">&#43; Add person</button></div>`:''}
    </div>`;
}
async function changeUserRole(id, role){
  const u = STATE.users.find(x=>x.id===id);
  try{
    await apiJson(`/api/users/${id}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u.username, display_name:u.display_name, email:u.email||'', role})});
    toast('Role updated.');
    await loadUsers(); document.getElementById('skillsTabBody').innerHTML = skillsRoles();
  }catch(e){ toast(e.message, true); }
}
async function deactivateUser(id){
  if(!confirm('Remove this person\'s access?')) return;
  try{
    await apiFetch(`/api/users/${id}`, {method:'DELETE'});
    toast('Access removed.');
    await loadUsers(); document.getElementById('skillsTabBody').innerHTML = skillsRoles();
  }catch(e){ toast(e.message, true); }
}
async function inviteUser(){
  const username = document.getElementById('inviteUsername').value.trim();
  const display_name = document.getElementById('inviteName').value.trim();
  const password = document.getElementById('invitePassword').value;
  const role = document.getElementById('inviteRole').value;
  if(!username || !password){ toast('Username and a temporary password are required.', true); return; }
  try{
    await apiJson('/api/users', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, display_name, password, role})});
    toast('Person added.');
    await loadUsers(); document.getElementById('skillsTabBody').innerHTML = skillsRoles();
  }catch(e){ toast(e.message, true); }
}

/* ================= Repository page ================= */
function pageRepository(){
  return `<div class="page-head"><h1>Data Repository</h1><p>Every month's final Tally sheet, ready to download — grouped by platform.</p></div>
    <div class="tabs" id="repoTabs"></div>
    <div id="repoBody">${skillsTabLoading()}</div>`;
}
async function loadRepository(){
  STATE.repoPlatform = STATE.repoPlatform || (STATE.platforms[0]||{}).slug;
  document.getElementById('repoTabs').innerHTML = STATE.platforms.map(p=>`<button class="tabbtn ${p.slug===STATE.repoPlatform?'on':''}" onclick="STATE.repoPlatform='${p.slug}'; loadRepository();">${escapeHtml(p.display_name)}</button>`).join('');
  const runs = STATE.runs.filter(r=>r.platform_slug===STATE.repoPlatform);
  const body = document.getElementById('repoBody');
  const rowsHtml = [];
  for(const r of runs){
    let gens = [];
    try{ gens = await apiJson(`/api/tally-runs/${r.id}/generations`); }catch(e){}
    // Only finished builds are "a final file" worth listing here - a
    // run that's still mid-conversation (no generation yet, or one
    // still processing) belongs in Recent Chats, not here.
    gens.forEach(g=>{
      if(g.status!=='ready') return;
      const ready = g.review_pending_count===0;
      const approvalChip = g.review_status==='approved' ? '<span class="chip chip-ok">Approved</span>' : g.review_status==='submitted' ? '<span class="chip chip-neutral">With approver</span>' : g.review_status==='returned' ? '<span class="chip chip-warn">Sent back</span>' : ready ? '<span class="chip chip-ok">Ready</span>' : '<span class="chip chip-neutral">Draft</span>';
      rowsHtml.push(`<tr><td style="font-weight:600;">${escapeHtml(r.period_label||'—')}</td><td>${escapeHtml([g.order_type,g.location].filter(Boolean).join(' · ')||'All')}</td><td class="mono">${g.total_rows}</td><td>${approvalChip}</td><td>${fmtWhen(g.processed_at||g.created_at)}</td>
        <td style="display:flex;gap:6px;justify-content:flex-end;">${ready?`<a class="btn btn-sm" href="/api/tally-generations/${g.id}/download/excel">&#11015; Excel</a><a class="btn btn-sm" href="/api/tally-generations/${g.id}/download/tally-xml">&#11015; XML</a>`:'<span style="font-size:12px;color:var(--ink-faint);">Flagged rows still open</span>'}</td></tr>`);
    });
  }
  if(!rowsHtml.length){ body.innerHTML = '<div class="empty-state" style="padding:40px;text-align:center;color:var(--ink-faint);">No finished Tally sheets yet for this platform.</div>'; return; }
  body.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Period</th><th>Slice</th><th>Rows</th><th>Status</th><th>Updated</th><th></th></tr></thead><tbody>${rowsHtml.join('')}</tbody></table></div>`;
}
</script>
